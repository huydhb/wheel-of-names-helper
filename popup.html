<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hack Wheel Helper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 15px;
      color: #89b4fa;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f38ba8;
      box-shadow: 0 0 6px rgba(243, 139, 168, 0.6);
      transition: background 0.3s;
    }
    .label {
      font-size: 12px;
      color: #a6adc8;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #45475a;
      background: #313244;
      color: #fff;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #89b4fa;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    #btn-apply {
      background: #a6e3a1;
      color: #11111b;
    }
    #btn-reset {
      background: #f38ba8;
      color: #11111b;
    }
    .info-log {
      font-size: 11px;
      color: #f9e2af;
      min-height: 28px;
      word-break: break-all;
      background: #181825;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #313244;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🎯 Hack Wheel Helper</span>
    <span id="status-dot" class="status-dot"></span>
  </div>

  <div class="label">Tên mục tiêu (ưu tiên từ trái sang phải):</div>
  <input type="text" id="target-input" placeholder="VD: My, Lô, A" />

  <div class="btn-group">
    <button id="btn-apply">Áp Dụng</button>
    <button id="btn-reset">Hủy Hack</button>
  </div>

  <div id="info-log" class="info-log">Đang kiểm tra kết nối tới Wheel of Names...</div>

  <script src="popup.js"></script>
</body>
</html>
